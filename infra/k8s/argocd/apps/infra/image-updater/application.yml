apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: "0.x"
      helm:
        valueFiles:
          - $values/infra/k8s/helm/image-updater/values.yml
    - repoURL: https://github.com/gbmoraes-dev/blueprint
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
