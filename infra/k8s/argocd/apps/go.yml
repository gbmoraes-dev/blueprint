apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: go
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"

spec:
  project: default
  source:
    repoURL: https://github.com/gbmoraes-dev/blueprint
    targetRevision: main
    path: infra/k8s/services/go/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
