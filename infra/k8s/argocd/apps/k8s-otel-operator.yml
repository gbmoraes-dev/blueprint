apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: otel-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"

spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-operator
      targetRevision: "0.112.x"
      helm:
        valueFiles:
          - $values/infra/k8s/helm/otel-operator/values.yml
    - repoURL: https://github.com/gbmoraes-dev/blueprint
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
