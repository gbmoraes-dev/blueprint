apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: go-success-rate
spec:
  metrics:
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring:9090
          query: |
            sum(rate(
              nginx_ingress_controller_requests{
                service="go-stable",
                status!~"5.."
              }[2m]
            )) /
            sum(rate(
              nginx_ingress_controller_requests{
                service="go-stable"
              }[2m]
            ))
