apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater

metadata:
  name: go
  namespace: argocd

spec:
  namespace: argocd
  writeBackConfig:
    method: git
    gitConfig:
      repository: https://github.com/gbmoraes-dev/blueprint
      branch: main
      writeBackTarget: kustomization:infra/k8s/services/go/overlays/local
      credentials: secret:argocd/git-credentials#auth
  applicationRefs:
    - namePattern: go
      images:
        - alias: go
          imageName: ghcr.io/gbmoraes-dev/blueprint-go:latest
          commonUpdateSettings:
            updateStrategy: digest
            forceUpdate: true
            pullSecret: secret:argocd/ghcr-credentials#auth
