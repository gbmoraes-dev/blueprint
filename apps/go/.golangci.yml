version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # --- Correctness ---
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # --- Bugs & Safety ---
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - nilerr
    - noctx
    - sqlclosecheck
    - reassign
    - unparam

    # --- Performance ---
    - prealloc
    - makezero

    # --- Code Style ---
    - gocritic
    - godot
    - misspell
    - whitespace
    - unconvert
    - wastedassign

    # --- Complexity ---
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - maintidx
    - nestif

    # --- Security ---
    - gosec

    # --- Go Idioms ---
    - godox
    - gomoddirectives
    - nolintlint
    - predeclared
    - thelper
    - tparallel
    - testifylint
    - usetesting

  settings:
    cyclop:
      max-complexity: 10

    funlen:
      lines: 80
      statements: 50

    gocognit:
      min-complexity: 15

    gocyclo:
      min-complexity: 10

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated

    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - BUG

    gosec:
      severity: medium
      confidence: medium

    maintidx:
      under: 20

    misspell:
      locale: US

    nestif:
      min-complexity: 4

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - funlen
          - godot
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
